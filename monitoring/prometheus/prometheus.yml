global:
  scrape_interval: 30s
  scrape_timeout: 25s   # Keep timeout closely aligned below interval


scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
        - localhost:9090
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100', "192.168.60.60:9100", "192.168.60.61:9100", "192.168.60.62:9100"] 
  - job_name: 'kafka-exporter'
    static_configs:
      - targets:
        - 'kafka-exporter:8000'
  - job_name: 'mongodb-exporter'
    static_configs:
      - targets: 
        - 'mongodb-exporter:9216'
    metrics_path: /metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080', "192.168.60.60:8090", "192.168.60.61:8090", "192.168.60.62:8090"]