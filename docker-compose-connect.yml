services:
  kafka-connect:
    profiles:
      - all
      - kafka_connect
      - kafka_connect_standalone
    image: jpo-kafka-connect-mongo
    build:
      context: kafka-connect
      dockerfile: Dockerfile
    restart: ${RESTART_POLICY:-on-failure:3}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G
    ports:
      - "8083:8083"
      - "9404:9404" # Prometheus JMX exporter
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 30s
      timeout: 10s
      retries: 4
    depends_on:
      mongo:
        condition: service_healthy
        required: false
      kafka:
        condition: service_healthy
        required: false
    environment:
      CONNECT_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: kafka-connect-group
      # Topics are created with jikkou in the kafka-setup service
      CONNECT_CONFIG_STORAGE_TOPIC: topic.KafkaConnectConfigs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: -1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: ${CONNECT_FLUSH_INTERVAL:-1000}
      CONNECT_OFFSET_STORAGE_TOPIC: topic.KafkaConnectOffsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: -1
      CONNECT_OFFSET_STORAGE_CLEANUP_POLICY: compact
      CONNECT_STATUS_STORAGE_TOPIC: topic.KafkaConnectStatus
      CONNECT_STATUS_STORAGE_CLEANUP_POLICY: compact
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: -1
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_LOG4J_ROOT_LOGLEVEL: ${CONNECT_LOG_LEVEL:-ERROR}
      CONNECT_LOG4J_LOGGERS: "org.apache.kafka.connect.runtime.rest=${CONNECT_LOG_LEVEL:-ERROR},org.reflections=${CONNECT_LOG_LEVEL:-ERROR},com.mongodb.kafka=${CONNECT_LOG_LEVEL:-ERROR},io.confluent.connect.s3=${CONNECT_LOG_LEVEL:-ERROR}"
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components
      KAFKA_OPTS: "-javaagent:/usr/share/jmx-exporter/jmx_prometheus_javaagent.jar=9404:/usr/share/jmx-exporter/jmx-exporter.yml"
      # The S3 sink connector uses the AWS default credential provider chain. In AWS, use an IAM role
      # (EC2 instance profile, ECS task role or EKS IRSA) and leave the access keys blank.
      # The access keys are only intended for the local S3 emulator (s3_local profile).
      AWS_REGION: ${CONNECT_S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${CONNECT_S3_LOCAL_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${CONNECT_S3_LOCAL_SECRET_ACCESS_KEY:-}

  kafka-connect-setup:
    profiles:
      - all
      - kafka_connect
      - kafka_connect_standalone
      - kafka_connect_setup
    image: jpo-jikkou
    build:
      context: jikkou
      dockerfile: Dockerfile.jikkou
    entrypoint: ./kafka_connector_init.sh
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    depends_on:
      kafka-connect:
        condition: service_healthy
        required: false
    environment:
      CONNECT_URL: ${CONNECT_URL:-http://connect:8083}
      CONNECT_TASKS_MAX: ${CONNECT_TASKS_MAX:-10}
      CONNECT_CREATE_ODE: ${CONNECT_CREATE_ODE:-true}
      CONNECT_CREATE_GEOJSONCONVERTER: ${CONNECT_CREATE_GEOJSONCONVERTER:-true}
      CONNECT_CREATE_CONFLICTMONITOR: ${CONNECT_CREATE_CONFLICTMONITOR:-true}
      CONNECT_CREATE_INTERSECTION_API: ${CONNECT_CREATE_INTERSECTION_API:-true}
      CONNECT_CREATE_DEDUPLICATOR: ${CONNECT_CREATE_DEDUPLICATOR:-false}
      CONNECT_CREATE_MECDEPOSIT: ${CONNECT_CREATE_MECDEPOSIT:-false}
      MONGO_CONNECTOR_USERNAME: ${MONGO_ADMIN_DB_USER:-admin}
      MONGO_CONNECTOR_PASSWORD: ${MONGO_ADMIN_DB_PASS:-replace_me}
      
      MONGO_DB_IP: ${MONGO_IP:-mongo}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-CV}

      # S3 archive connector, see docs/S3_Archive.md
      CONNECT_CREATE_S3_ARCHIVE: ${CONNECT_CREATE_S3_ARCHIVE:-false}
      CONNECT_S3_BUCKET_NAME: ${CONNECT_S3_BUCKET_NAME:-}
      CONNECT_S3_REGION: ${CONNECT_S3_REGION:-us-east-1}
      CONNECT_S3_ENVIRONMENT: ${CONNECT_S3_ENVIRONMENT:-}
      CONNECT_S3_TOPICS: ${CONNECT_S3_TOPICS:-}
      CONNECT_S3_TASKS_MAX: ${CONNECT_S3_TASKS_MAX:-}
      CONNECT_S3_FLUSH_SIZE: ${CONNECT_S3_FLUSH_SIZE:-}
      CONNECT_S3_ROTATE_INTERVAL_MS: ${CONNECT_S3_ROTATE_INTERVAL_MS:-}
      CONNECT_S3_ACL_CANNED: ${CONNECT_S3_ACL_CANNED:-}
      CONNECT_S3_STORE_URL: ${CONNECT_S3_STORE_URL:-}
      # Compact raw S3 archive connector, uses the CONNECT_S3_* bucket and environment settings above
      CONNECT_CREATE_S3_RAW_ARCHIVE: ${CONNECT_CREATE_S3_RAW_ARCHIVE:-false}
      CONNECT_S3_RAW_TOPICS: ${CONNECT_S3_RAW_TOPICS:-}
    volumes:
      - ${CONNECT_KAFKA_CONNECTORS_VALUES_FILE:-./jikkou/kafka-connectors-values.yaml}:/kafka-connectors-values.yaml

  # Local S3 compatible emulator for development and testing of the S3 archive connector only.
  # Not intended for production use, where a real Amazon S3 bucket must be used.
  s3-local:
    profiles:
      - s3_local
    image: adobe/s3mock:5.2.3
    hostname: s3-local
    restart: ${RESTART_POLICY:-on-failure:3}
    ports:
      - "${S3_LOCAL_PORT:-9000}:9090"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${CONNECT_S3_BUCKET_NAME:-jpo-archive-local}
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ${CONNECT_S3_REGION:-us-east-1}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - s3_local_data:/s3mockroot
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

volumes:
  s3_local_data: